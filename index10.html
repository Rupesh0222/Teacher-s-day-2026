<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>One Last Thing&#8230;</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style10.css">
</head>
<body>

<!-- custom fountain-pen cursor + ink trail -->
<canvas id="ink-canvas"></canvas>
<div class="pen-cursor" id="pen-cursor">
  <svg viewBox="0 0 40 40" width="40" height="40">
    <g transform="rotate(45 20 20)">
      <path d="M20 4 L26 16 L20 34 L14 16 Z" fill="#151b23" stroke="#C6A24E" stroke-width="0.6"/>
      <path d="M20 16 L23 16 L20 30 L17 16 Z" fill="#C6A24E"/>
      <line x1="20" y1="4" x2="20" y2="16" stroke="#C6A24E" stroke-width="0.8"/>
    </g>
  </svg>
</div>

<button class="music-toggle" aria-pressed="false" aria-label="Play background music">
  <svg class="icon-on" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="18" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
  <svg class="icon-off" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="18" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="3" y1="3" x2="21" y2="21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
</button>

<!-- Background music for this page -->
<audio id="bg-music" loop preload="none">
  <source src= audio/bgm.mp3 type="audio/mpeg">
</audio>

<main class="finale-stage">
  <div class="ambient-glow"></div>

  <div class="reveal-wrap">
    <p class="reveal-line" id="reveal-line"></p>

    <div class="finale-block" id="finale-block" aria-hidden="true">
      <p class="finale-text">Thank You, Teachers. <span class="heart">&#10084;&#65039;</span></p>
      <button class="replay-btn" id="replay-btn">Please give us a review</button>
    </div>
  </div>
</main>

<script src="script10.js"></script>
</body>
</html>
