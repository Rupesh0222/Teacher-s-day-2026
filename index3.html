<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Teacher's Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style3.css">
</head>
<body>

<!-- custom fountain-pen cursor + ink trail -->
<canvas id="ink-canvas"></canvas>
<div class="pen-cursor" id="pen-cursor">
  <svg viewBox="0 0 40 40" width="40" height="40">
    <g transform="rotate(45 20 20)">
      <path d="M20 4 L26 16 L20 34 L14 16 Z" fill="#151b23" stroke="#C6A24E" stroke-width="0.6"/>
      <path d="M20 16 L23 16 L20 30 L17 16 Z" fill="#C6A24E"/>
      <line x1="20" y1="4" x2="20" y2="16" stroke="#C6A24E" stroke-width="0.8"/>
    </g>
  </svg>
</div>

<button class="music-toggle" aria-pressed="false" aria-label="Play background music">
  <svg class="icon-on" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="18" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
  <svg class="icon-off" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="18" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="3" y1="3" x2="21" y2="21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
</button>

<!-- Background music for this page -->
<audio id="bg-music" loop preload="none">
  <source src= audio/bgm.mp3 type="audio/mpeg">
</audio>

<!-- Card flip sound effect -->
<audio id="flip-sound" preload="auto">
  <source src= audio/flip.mp3 type="audio/mpeg">
</audio>

<header class="wall-header">
  <h1 class="wall-title">Teacher&#8217;s Wall</h1>

  <button class="search-toggle" id="search-toggle" aria-label="Search for a teacher">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="16.2" y1="16.2" x2="21" y2="21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>

  <div class="search-bar" id="search-bar">
    <svg viewBox="0 0 24 24" class="search-icon"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="16.2" y1="16.2" x2="21" y2="21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <input type="text" id="search-input" placeholder="Enter your name" autocomplete="off" />
    <button class="search-close" id="search-close" aria-label="Close search">&times;</button>
    <p class="search-hint" id="search-hint"></p>
  </div>
</header>

<main class="blackboard-wrap">
  <div class="blackboard" id="blackboard">
    <div class="blackboard-grain"></div> 

    <!-- chalk doodle decorations --> 
    <svg class="doodle doodle-star" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4 L23 16 L36 16 L25 23 L29 36 L20 28 L11 36 L15 23 L4 16 L17 16 Z" fill="none" stroke="#ECE7DA" stroke-width="1"/></svg>
    <svg class="doodle doodle-swirl" viewBox="0 0 60 30" aria-hidden="true"><path d="M2 20 Q15 2 30 15 T58 10" fill="none" stroke="#ECE7DA" stroke-width="1.2" stroke-linecap="round"/></svg>
    <svg class="doodle doodle-underline" viewBox="0 0 120 16" aria-hidden="true"><path d="M2 10 Q30 2 60 9 T118 6" fill="none" stroke="#C6A24E" stroke-width="1.4" stroke-linecap="round"/></svg>
    <svg class="doodle doodle-heart" viewBox="0 0 32 28" aria-hidden="true"><path d="M16 26 C4 18 2 10 8 6 C12 3.5 16 6 16 10 C16 6 20 3.5 24 6 C30 10 28 18 16 26 Z" fill="none" stroke="#ECE7DA" stroke-width="1.1"/></svg>

    <div class="polaroid-grid" id="polaroid-grid" aria-label="Teacher photos"></div>

  </div>

  <div class="chalk-tray" aria-hidden="true">
    <span class="chalk c1"></span>
    <span class="chalk c2"></span>
    <span class="chalk c3"></span>
    <span class="eraser"></span>
  </div>
</main>

<!-- Profile overlay -->
<div class="profile-overlay" id="profile-overlay" aria-hidden="true">
  <button class="profile-close" id="profile-close" aria-label="Close profile">&times;</button>

  <div class="profile-stage">
    <div class="profile-card" id="profile-card">

      <div class="card-face card-front" id="card-front"></div>

      <div class="card-face card-back" id="card-back"></div>

    </div>
  </div>
</div>

<button class="next-btn" id="next-btn" aria-label="Continue to next page">
  <svg viewBox="0 0 44 44">
    <circle cx="22" cy="22" r="20.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <path d="M18 14 L28 22 L18 30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="script3.js"></script>
</body>
</html>
